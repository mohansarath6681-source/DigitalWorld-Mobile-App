<title>Digital World ID Card App</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eaf2ff;font-family:Arial,sans-serif;color:#10244d}
.app{max-width:480px;min-height:100vh;margin:auto;background:#f7faff;padding-bottom:78px}
.header{background:linear-gradient(145deg,#034cc4,#087fe5,#08b6ea);padding:20px 16px 25px;border-radius:0 0 30px 30px;color:#fff;text-align:center}
.logo{width:105px;height:105px;object-fit:cover;border-radius:50%;background:#fff;box-shadow:0 5px 18px #0004}
.brand{font-size:25px;font-weight:900;margin-top:9px}.sub{font-size:12px;margin-top:4px}
.install{display:none;margin:14px auto 0;border:0;border-radius:14px;padding:11px 18px;background:#fff;color:#0757d9;font-weight:900}
.content{padding:16px}.card{background:#fff;border-radius:21px;padding:16px;margin-bottom:15px;box-shadow:0 5px 18px #173b6b12}
.title{font-size:18px;font-weight:900;margin-bottom:12px}
.primary{width:100%;border:0;border-radius:16px;padding:16px;background:linear-gradient(90deg,#0757d9,#079fe8);color:#fff;font-size:17px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.item{background:#fff;border:1px solid #dfe7f5;border-radius:17px;padding:14px 8px;text-align:center;font-weight:800}
.icon{font-size:28px;display:block;margin-bottom:6px}.price{font-size:12px;color:#0757d9;margin-top:4px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:70px;background:#fff;border-top:1px solid #dce5f3;display:flex;justify-content:space-around;align-items:center}
.nav{font-size:11px;font-weight:700;text-align:center;color:#66738a}.nav span{display:block;font-size:23px;margin-bottom:2px}.active{color:#0757d9}
</style>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
let deferredPrompt;
const installBtn=document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  installBtn.style.display="block";
});
installBtn.addEventListener("click",async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.style.display="none";
});
function openCropper(){location.href="https://mohansarath6681-source.github.io/id-card-cropper/";}
async function shareApp(){
  if(navigator.share){
    try{await navigator.share({title:"Digital World ID Card App",text:"Digital World ID Card Print Service",url:location.href});}catch(e){}
  }else{alert("Share सुविधा उपलब्ध नहीं है।");}
}
</script>
